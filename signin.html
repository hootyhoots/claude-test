<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - StreamVibe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="page-header"></div>

  <div class="page-container">
    <div class="auth-card">
      <h1>Sign In</h1>
      <p class="auth-subtitle">Welcome back! Enter your details below.</p>
      <form class="auth-form" onsubmit="event.preventDefault(); window.location.href='index.html';">
        <label>Email</label>
        <input type="email" placeholder="you@example.com" required>
        <label>Password</label>
        <input type="password" placeholder="Enter your password" required>
        <div class="auth-options">
          <label class="checkbox-label"><input type="checkbox"> Remember me</label>
          <a href="help.html">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
      <p class="auth-footer">Don't have an account? <a href="signup.html">Start Free Trial</a></p>
    </div>
  </div>

  <div id="page-footer"></div>
  <script src="shared.js"></script>
  <script>renderSharedLayout("home");</script>
</body>
</html>
