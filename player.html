<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Now Playing - StreamVibe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="page-header"></div>

  <div class="player-page">
    <div class="player-viewport" id="playerViewport">
      <div class="player-placeholder">
        <div class="player-icon">&#9654;</div>
        <p>Click to play</p>
      </div>
      <div class="player-controls">
        <div class="player-progress"><div class="player-progress-fill" style="width: 35%;"></div></div>
        <div class="player-buttons">
          <button class="player-btn">&#9198;</button>
          <button class="player-btn player-btn-main" id="playPauseBtn">&#9654;</button>
          <button class="player-btn">&#9197;</button>
          <span class="player-time">0:52:14 / 2:34:00</span>
          <div class="player-right-btns">
            <button class="player-btn">&#128264;</button>
            <button class="player-btn" onclick="document.getElementById('playerViewport').requestFullscreen()">&#9974;</button>
          </div>
        </div>
      </div>
    </div>

    <div class="player-details" id="playerDetails">
      <!-- Filled by JS -->
    </div>
  </div>

  <div id="page-footer"></div>
  <script src="shared.js"></script>
  <script>
    renderSharedLayout("home");

    const params = new URLSearchParams(window.location.search);
    const titleParam = params.get("title");
    const item = titleParam ? findContent(decodeURIComponent(titleParam)) : sharedContent[10];
    const details = document.getElementById("playerDetails");

    document.title = (item ? item.title : "Now Playing") + " - StreamVibe";

    if (item) {
      details.innerHTML = `
        <h1>${item.title}</h1>
        <div class="hero-meta">
          <span class="rating">&#9733; ${item.rating}</span>
          <span>${item.year}</span>
          <span>${item.duration}</span>
          <span class="maturity">${item.maturity}</span>
          <span>${item.genre}</span>
        </div>
        <p class="player-description">${item.description}</p>
        <div class="player-actions">
          <a href="mylist.html" class="btn btn-outline">+ My List</a>
          <a href="title.html?title=${titleToSlug(item.title)}" class="btn btn-outline">More Info</a>
        </div>
      `;
      document.getElementById("playerViewport").style.background =
        "linear-gradient(135deg, " + item.color + ", " + item.color + "99)";
    }

    const playPauseBtn = document.getElementById("playPauseBtn");
    let playing = false;
    playPauseBtn.addEventListener("click", () => {
      playing = !playing;
      playPauseBtn.innerHTML = playing ? "&#9646;&#9646;" : "&#9654;";
    });

    document.querySelector(".player-placeholder").addEventListener("click", () => {
      playing = true;
      playPauseBtn.innerHTML = "&#9646;&#9646;";
    });
  </script>
</body>
</html>
